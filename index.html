<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thaziana's Cake Factory</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center;background:#fff6fa;color:#654765;font-family:system-ui,sans-serif}</style>
</head>
<body>
  <p id="loading">Chargement de Thaziana's Cake Factory…</p>
  <script>
    const source = "https://raw.githubusercontent.com/thazianahr/veille-numerique-automatique/fd9cae7bcedac52ec0978173b1be56ce54b7a231/index.html";
    fetch(source)
      .then(response => {
        if (!response.ok) throw new Error("Impossible de charger la version restaurée");
        return response.text();
      })
      .then(html => {
        html = html.replace("Atelier Pâtisserie — Création libre", "Thaziana's Cake Factory");
        html = html.replace('Atelier <span>Pâtisserie</span>', "Thaziana's <span>Cake Factory</span>");
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = '<p>Impossible de charger Thaziana\'s Cake Factory.</p>';
      });
  </script>
</body>
</html>
