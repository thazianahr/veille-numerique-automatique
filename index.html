<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pâtisserie Palette</title>
  <style>
    :root{--ink:#5d3c62;--pink:#ffb3cf;--lav:#cbb2f3;--cream:#fff8ed;--shadow:0 10px 28px #704f6930}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff7fb,#f9ecff 48%,#edf8ff);min-height:100vh}
    .shell{max-width:1180px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#ffffffbb;border:1px solid #f3d5e4;border-radius:22px;box-shadow:var(--shadow)}
    .brand{font-family:Georgia,serif;font-size:21px}.brand b{color:#b85e96}.stats{display:flex;gap:8px}.pill{background:var(--cream);border:1px solid #efcfdc;border-radius:999px;padding:7px 10px;font-weight:800}
    .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.nav button,.btn{border:0;border-radius:14px;padding:11px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer;box-shadow:0 4px 12px #6a4a6212}.nav button.active{background:linear-gradient(135deg,#ffc0d7,#e8b9ef)}
    .layout{display:grid;grid-template-columns:220px 1fr 260px;gap:12px}.panel{background:#ffffffcc;border:1px solid #efd4e2;border-radius:22px;padding:13px;box-shadow:var(--shadow)}.panel h3{margin:2px 0 10px;font-family:Georgia,serif}
    .tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:0;border-radius:9px;padding:7px;background:#f9edf4;color:var(--ink);cursor:pointer}.tabs button.active{background:#d9b9e8}
    .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.choice{min-height:62px;border:2px solid transparent;border-radius:13px;background:#fff4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size12px;font-weight800}.choice.selected{border-color:#c98ac8;background:#f1dff7}.choice span{font-size26px}
    .stage{min-height:520px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#fff2f9 65%,#dfbfae 65%)}.stage:before{content:"";position:absolute;left:0;right:0;bottom:15%;height:12%;background:repeating-linear-gradient(90deg,#e9bdd1 0 30px,#fff0f5 30px 60px)}
    .window{position:absolute;left:25px;top:25px;width:130px;height150px;border:7px solid #a37fa4;border-radius70px 70px 12px12px;background:linear-gradient(135deg,#cef2ff,#fff)}.window:after{content:"🌸  🌷";position:absolute;bottom:8px;left:18px;font-size25px}
    .cake-workspace{position:absolute;left:50%;bottom:90px;width270px;height270px;transform:translateX(-50%);display:flex;align-items:center;justify-content:flex-end;flex-direction:column}.cake{display:flex;flex-direction:column-reverse;align-items:center;width:220px}.plate{width270px;height28px;border-radius50%;background:#fff;border:4px solid #b9d5ed;box-shadow:0 8px12px#8b607a40}
    .tier{position:relative;width:var(--w);height:58px;margin-top:-2px;border-radius:14px 14px 8px8px;border:3px solid #fff9;box-shadow:inset0-10px#00000012,inset0 8px#ffffff55}.tier.square{border-radius:7px}.tier.heart{border-radius:45% 45% 12px12px}.tier:before{content:"";position:absolute;left:-1px;right:-1px;top:-3px;height16px;border-radius50%;background:var(--cream);box-shadow:0 5px0 var(--drip)}
    .topping{position:absolute;font-size25px;filter:drop-shadow(0 2px2px #7f5a7666);animation:pop .28s ease-out}@keyframes pop{from{transform:scale(.2) translateY(-20px);opacity:0}}.sparkle{position:absolute;font-size16px;animation:twinkle1.3s infinite}@keyframes twinkle{50%{transform:rotate(180deg) scale(.5);opacity:.4}}
    .palette{position:absolute;z-index:8;left:12px;bottom:18px;display:flex;flex-wrap:wrap;gap5px;width180px}.palette button{width38px;height38px;border:0;border-radius50%;background:#fff;font-size20px;cursor:pointer}
    .tools{display:grid;grid-template-columns:repeat(3,1fr);gap7px;margin-top10px}.tool{height52px;border:0;border-radius12px;background:#fff3f7;cursor:pointer;font-size20px}.tool.active{background:#d9c1ed}.order-card{background:linear-gradient(135deg,#fff7ed,#fff);border:1px solid#efd8c7;border-radius16px;padding10px;margin-bottom10px}.customer{display:flex;align-items:center;gap8px}.avatar{font-size36px}.progress{height7px;border-radius8px;background:#eee;margin8px0}.progress i{display:block;height100%;width100%;background:linear-gradient(90deg,#ffb0c9,#b89edb)}
    .tiers{display:flex;gap7px;margin-top8px}.tiers button{flex:1;border:0;border-radius10px;padding8px;background:#fff1f6;color:var(--ink);font-weight800}.tiers button.active{background:#d9c1ed}
    .modal{display:none;position:fixed;z-index20;inset:0;background:#55395055;place-items:center;padding18px}.modal.show{display:grid}.modal-card{width:min(520px,100%);background:#fffafc;border-radius24px;padding22px;box-shadow:0 25px80px#442e4d66;text-align:center}.modal-card h2{font-family:Georgia,serif}.reward{font-size48px}.toast{position:fixed;z-index30;left50%;bottom20px;transform:translate(-50%,100px);background:#604564;color:white;border-radius999px;padding12px20px;transition:.35s}.toast.show{transform:translate(-50%,0)}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.stage{min-height440px}.window{transform:scale(.75);transform-origin:top left}.stats .level{display:none}}
  </style>
</head>
<body>
<div class="shell">
<header><div class="brand">🌸 <b>Pâtisserie</b> Palette</div><div class="stats"><div class="pill level">Niv. <span id="level">1</span></div><div class="pill">⭐ <span id="stars">0</span></div><div class="pill">🪙 <span id="money">80</span></div></div></header>
<nav class="nav"><button class="active" data-view="game">🎂 Jouer</button><button data-view="free">✨ Création libre</button><button data-view="shop">🛍️ Boutique</button><button data-view="decor">🏡 Ma pâtisserie</button></nav>
<div class="layout">
<aside class="panel"><h3 id="sideTitle">Saveurs</h3><div class="tabs" id="tabs"><button class="active" data-tab="flavor">Saveurs</button><button data-tab="cream">Crème</button><button data-tab="shape">Forme</button></div><div class="choices" id="choices"></div><div class="tiers" id="tiers"><button data-tiers="1">1 étage</button><button class="active" data-tiers="2">2 étages</button><button data-tiers="3">3 étages</button></div></aside>
<section class="stage" id="stage"><div class="window"></div><div class="cake-workspace"><div class="cake" id="cake"></div><div class="plate"></div></div><div class="palette" id="palette"></div></section>
<aside class="panel"><h3 id="rightTitle">Commande du jour</h3><div id="orderArea"></div><div class="progress"><i></i></div><div class="tools"><button class="tool active" data-tool="place">🧁</button><button class="tool" data-tool="cream">🍦</button><button class="tool" data-tool="sprinkle">✨</button><button class="tool" data-tool="remove">🧽</button><button class="tool" id="resetCake">🔄</button></div><button class="btn" id="serve" style="width:100%;margin-top:10px;background:#ffc9dd">Servir la commande</button></aside>
</div></div>
<div class="modal" id="modal"><div class="modal-card"><div class="reward" id="rewardIcon">⭐</div><h2 id="rewardTitle">Magnifique !</h2><p id="rewardText"></p><button class="btn" id="closeModal">Continuer</button></div></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const defaults={money:80,stars:0,level:1,flavor:'vanille',cream:'vanillecream',shape:'round',tiers:2,bought:['vanille','chocolat','fraise','vanillecream','pinkcream','round','square','heart'],flavorLocked:false};
let state=Object.assign({},defaults);try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem('patisseriePalette')||'{}'))}catch(e){}
let tab='flavor',freeMode=false,activeTool='place',orderIndex=0;
const flavors=[['vanille','Vanille','🍦'],['chocolat','Chocolat','🍫'],['fraise','Fraise','🍓'],['citron','Citron','🍋'],['redvelvet','Red Velvet','🌹'],['lavande','Lavande','🪻']];
const creams=[['vanillecream','Vanille','🤍'],['chocolatecream','Ganache','🍫'],['pinkcream','Crème rose','🌸'],['bluecream','Crème bleue','🧊']];
const shapes=[['round','Ronde','◯'],['square','Carrée','▢'],['heart','Cœur','♡']];
const toppings=['🍓','🍒','🫐','🍫','🌸','🍬','💎','🕯️','🧁','🍋'];
const orders=[{name:'Clara',emoji:'👧🏻',flavor:'fraise',shape:'round',cream:'pinkcream',tiers:2,request:'Une douceur rose à 2 étages'},{name:'Monsieur Théo',emoji:'🧑🏻',flavor:'chocolat',shape:'square',cream:'chocolatecream',tiers:3,request:'Un grand chocolat élégant'},{name:'Élise',emoji:'👩🏼',flavor:'citron',shape:'heart',cream:'vanillecream',tiers:2,request:'Un cœur citronné avec fleurs'}];
const colors={vanille:'#f6deb1',chocolat:'#9b6547',fraise:'#e98da6',citron:'#f3df78',redvelvet:'#b84d61',lavande:'#baa2da'};
const creamsColor={vanillecream:'#fff4df',chocolatecream:'#7a4b3c',pinkcream:'#ffc2d8',bluecream:'#bedff1'};
function $(s,c=document){return c.querySelector(s)}function $$(s,c=document){return [...c.querySelectorAll(s)]}
function save(){try{localStorage.setItem('patisseriePalette',JSON.stringify(state))}catch(e){}}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1800)}
function renderStats(){ $('#money').textContent=state.money;$('#stars').textContent=state.stars;$('#level').textContent=state.level }
function choices(){let data=tab==='flavor'?flavors:tab==='cream'?creams:shapes,key=tab==='flavor'?'flavor':tab==='cream'?'cream':'shape';const box=$('#choices');box.innerHTML='';data.forEach(item=>{const b=document.createElement('button');b.className='choice'+(state[key]===item[0]?' selected':'');b.innerHTML='<span>'+item[2]+'</span>'+item[1];b.onclick=()=>{state[key]=item[0];save();choices();draw();toast(item[1]+' sélectionné');};box.append(b)})}
function draw(){const cake=$('#cake');cake.innerHTML='';for(let i=0;i<Number(state.tiers);i++){const tier=document.createElement('div');tier.className='tier '+state.shape;tier.style.setProperty('--w',(220-i*30)+'px');tier.style.background=colors[state.flavor]||'#f6deb1';tier.style.setProperty('--cream',creamsColor[state.cream]||'#fff4df');tier.style.setProperty('--drip','#ffd6e5');tier.dataset.index=i;tier.addEventListener('click',tierClick);cake.append(tier)}}
function tierClick(e){if(activeTool==='cream'){e.currentTarget.animate([{filter:'brightness(1.18)'},{filter:'brightness(1)'}],{duration:400});toast('Crème étalée');}else if(activeTool==='sprinkle'){addSparkle(e.currentTarget,e)}else if(activeTool==='remove'){$$('.topping,.sparkle',e.currentTarget).at(-1)?.remove()} }
function addSparkle(tier,e){const r=tier.getBoundingClientRect(),s=document.createElement('span');s.className='sparkle';s.textContent='✦';s.style.left=Math.max(5,Math.min(90,(e.clientX-r.left)/r.width*100))+'%';s.style.top=Math.max(5,Math.min(75,(e.clientY-r.top)/r.height*100))+'%';tier.append(s)}
function renderOrder(){if(freeMode){$('#orderArea').innerHTML='<div class="order-card"><div class="customer"><span class="avatar">✨</span><div><b>Création libre</b><br><small>Votre imagination est sans limite</small></div></div></div>';return}const o=orders[orderIndex];$('#orderArea').innerHTML='<div class="order-card"><div class="customer"><span class="avatar">'+o.emoji+'</span><div><b>'+o.name+'</b><br><small>'+o.request+'</small></div></div></div>'}
function setTool(tool){activeTool=tool;$$('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));}
$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');freeMode=b.dataset.view==='free';if(b.dataset.view==='shop'){tab='flavor';$('#sideTitle').textContent='Boutique';$('#rightTitle').textContent='Ingrédients'}else if(b.dataset.view==='decor'){$('#sideTitle').textContent='Décoration';$('#rightTitle').textContent='Ma pâtisserie'}else{$('#sideTitle').textContent=freeMode?'Création libre':'Saveurs';$('#rightTitle').textContent=freeMode?'Création libre':'Commande du jour'}choices();renderOrder()});
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;$('#sideTitle').textContent=tab==='flavor'?'Saveurs':tab==='cream?'Crèmes':'Formes';choices()});
$$('.tiers button').forEach(b=>b.onclick=()=>{$$('.tiers button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.tiers=Number(b.dataset.tiers);save();draw();toast(state.tiers+' étage'+(state.tiers>1?'s':''))});
$$('.tool[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('#resetCake').onclick=()=>{$$('.topping,.sparkle',$('#cake')).forEach(x=>x.remove());toast('Décorations retirées')};
toppings.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{const tiers=$$('.tier',$('#cake'));if(!tiers.length)return;const tier=tiers.at(-1),el=document.createElement('span');el.className='topping';el.textContent=t;el.style.left=(15+Math.random()*70)+'%';el.style.top=(12+Math.random()*32)+'px';tier.append(el);toast(t+' ajouté')};$('#palette').append(b)});
$('#serve').onclick=()=>{let stars=freeMode?2:1,money=freeMode?18:15;if(!freeMode){const o=orders[orderIndex],score=(state.flavor===o.flavor?2:0)+(state.shape===o.shape?2:0)+(state.cream===o.cream?2:0)+(state.tiers===o.tiers?1:0);stars=score>=5?3:score>=3?2:1;money=10+stars*10}state.money+=money;state.stars+=stars;state.level=1+Math.floor(state.stars/8);save();renderStats();$('#rewardIcon').textContent='⭐'.repeat(stars);$('#rewardTitle').textContent=stars===3?'Commande parfaite !':'Belle pâtisserie !';$('#rewardText').textContent='Vous gagnez '+money+' pièces et '+stars+' étoile'+(stars>1?'s':'')+'.';$('#modal').classList.add('show');if(!freeMode){orderIndex=(orderIndex+1)%orders.length;renderOrder()}};
$('#closeModal').onclick=()=>$('#modal').classList.remove('show');
renderStats();choices();renderOrder();draw();save();
})();
</script>
</body>
</html>
