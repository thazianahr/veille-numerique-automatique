<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#301547">
  <title>Code — Palais des gâteaux</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #170c24; color: #fff7ff; }
    * { box-sizing: border-box; }
    body { max-width: 1100px; margin: 0 auto; padding: 36px 20px; }
    a { color: #f1d3ff; }
    h1 { margin-bottom: 8px; }
    p { color: #e2cde9; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 22px 0; }
    button { padding: 10px 15px; border: 1px solid #b474a1; border-radius: 9px; background: #492c5b; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    pre { overflow: auto; padding: 22px; border: 1px solid #704b7e; border-radius: 14px; background: #100818; color: #f4e3f7; line-height: 1.55; tab-size: 2; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88rem; }
    .error { color: #ffb7af; }
  </style>
</head>
<body>
  <a href="gateaux.html">← Retour à l’atelier de gâteaux</a>
  <h1>Code source</h1>
  <p>Le code complet de <code>gateaux.html</code>, le jeu de création de gâteaux.</p>
  <div class="toolbar">
    <button id="copy-button" type="button" disabled>Copier le code</button>
    <span id="message" role="status" aria-live="polite">Chargement du code…</span>
  </div>
  <pre><code id="source"></code></pre>
  <script>
    const source = document.querySelector('#source');
    const message = document.querySelector('#message');
    const copyButton = document.querySelector('#copy-button');
    fetch('./gateaux.html')
      .then(response => {
        if (!response.ok) throw new Error('Fichier introuvable');
        return response.text();
      })
      .then(html => {
        source.textContent = html;
        copyButton.disabled = false;
        message.textContent = 'Code chargé.';
      })
      .catch(() => {
        message.className = 'error';
        message.textContent = 'Impossible de charger le fichier ici. Ouvrez cette page depuis un serveur web ou GitHub Pages.';
      });
    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(source.textContent);
        message.textContent = 'Code copié dans le presse-papiers.';
      } catch {
        message.textContent = 'Copie impossible dans ce navigateur.';
      }
    });
  </script>
</body>
</html>
