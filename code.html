<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2d">
  <title>Code — Veille numérique</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1220; color: #eef4ff; }
    * { box-sizing: border-box; }
    body { max-width: 1100px; margin: 0 auto; padding: 36px 20px; }
    a { color: #9cc4ff; }
    h1 { margin-bottom: 8px; }
    p { color: #b4c2d8; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 22px 0; }
    button { padding: 10px 15px; border: 1px solid #405675; border-radius: 9px; background: #1a2b44; color: white; font: inherit; cursor: pointer; }
    pre { overflow: auto; padding: 22px; border: 1px solid #293953; border-radius: 14px; background: #080e18; color: #d7e5fb; line-height: 1.55; tab-size: 2; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88rem; }
    .error { color: #ffb7af; }
  </style>
</head>
<body>
  <a href="index.html">← Retour à l’horloge et au minuteur</a>
  <h1>Code source</h1>
  <p>Cette page affiche le contenu complet de <code>index.html</code>, la page de veille numérique.</p>
  <div class="toolbar">
    <button id="copy-button" type="button" disabled>Copier le code</button>
    <span id="message" role="status" aria-live="polite">Chargement du code…</span>
  </div>
  <pre><code id="source"></code></pre>
  <script>
    const source = document.querySelector('#source');
    const message = document.querySelector('#message');
    const copyButton = document.querySelector('#copy-button');
    fetch('./index.html')
      .then((response) => {
        if (!response.ok) throw new Error('Le fichier index.html est introuvable.');
        return response.text();
      })
      .then((html) => {
        source.textContent = html;
        copyButton.disabled = false;
        message.textContent = 'Code chargé.';
      })
      .catch(() => {
        message.className = 'error';
        message.textContent = 'Impossible de charger le fichier ici. Lancez un serveur local ou ouvrez cette page depuis GitHub Pages.';
      });
    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(source.textContent);
        message.textContent = 'Code copié dans le presse-papiers.';
      } catch {
        message.textContent = 'Copie impossible dans ce navigateur.';
      }
    });
  </script>
</body>
</html>
