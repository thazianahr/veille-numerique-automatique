<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code — Atelier Pâtisserie</title><style>body{max-width:1100px;margin:auto;padding:28px 18px;font-family:system-ui;color:#654765;background:#fff8fc}a{color:#a05791}button{padding:10px 14px;border:0;border-radius:10px;background:#dbaed1;color:white;font-weight:800;cursor:pointer}pre{overflow:auto;border-radius:18px;background:#302236;color:#fff1fa;padding:22px;line-height:1.55}code{font-family:Consolas,monospace}</style></head><body><a href="index.html">← Retour à l’atelier</a><h1>Code source — Atelier Pâtisserie</h1><button id="copy" type="button">Copier le code</button> <span id="message" role="status"></span><pre><code id="source"></code></pre><script>const source=document.querySelector('#source'),message=document.querySelector('#message');fetch('./index.html').then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{source.textContent=t;message.textContent='Code chargé.'}).catch(()=>message.textContent='Impossible de charger le code depuis cet aperçu.');document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(source.textContent);message.textContent='Code copié !'}catch{message.textContent='Copie indisponible.'}});</script></body></html>
