<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code — Pâtisserie Palette</title>
<style>body{max-width:1100px;margin:auto;padding:28px 18px;font-family:system-ui;color:#5d3c62;background:#fff8fc}a{color:#a05791}button{padding:10px 14px;border:0;border-radius:10px;background:#dbaed1;color:white;font-weight:800}pre{overflow:auto;border-radius:18px;background:#302236;color:#fff1fa;padding:22px;line-height:1.55}code{font-family:Consolas,monospace}</style></head>
<body><a href="index.html">← Retour au jeu</a><h1>Code source — Pâtisserie Palette</h1><button id="copy">Copier le code</button><span id="message" role="status"></span><pre><code id="source"></code></pre>
<script>
const source=document.getElementById('source'),message=document.getElementById('message'),copy=document.getElementById('copy');
fetch('./index.html').then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{source.textContent=t;copy.disabled=false;message.textContent='Code chargé.'}).catch(()=>message.textContent='Impossible de charger le code depuis cet aperçu.');
copy.onclick=async()=>{try{await navigator.clipboard.writeText(source.textContent);message.textContent='Code copié !'}catch(e){message.textContent='Copie indisponible.'}};
</script></body></html>
